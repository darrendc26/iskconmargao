services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iskconmargao}
      POSTGRES_USER: ${POSTGRES_USER:-iskcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iskcon} -d ${POSTGRES_DB:-iskconmargao}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_dev:
