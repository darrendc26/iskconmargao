# Render Blueprint Infrastructure-as-Code Configuration
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. GO BACKEND API SERVICE
  # -------------------------------------------------------------
  - type: web
    name: iskconmargao-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: iskconmargao-db
          property: connectionString
      - key: SITE_URL
        value: https://iskconmargao-web.onrender.com
      - key: ADMIN_URL
        value: https://iskconmargao-admin.onrender.com
      - key: API_PUBLIC_URL
        value: https://iskconmargao-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://iskconmargao-web.onrender.com,https://iskconmargao-admin.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Fill these in Render Dashboard for R2 storage (optional):
      # - key: R2_ACCOUNT_ID
      # - key: R2_ACCESS_KEY_ID
      # - key: R2_SECRET_ACCESS_KEY
      # - key: R2_BUCKET
      # - key: R2_PUBLIC_BASE_URL
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  # -------------------------------------------------------------
  # 2. NEXT.JS PUBLIC WEB APP
  # -------------------------------------------------------------
  - type: web
    name: iskconmargao-web
    env: docker
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://iskconmargao-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://iskconmargao-backend.onrender.com
      - key: API_INTERNAL_URL
        value: https://iskconmargao-backend.onrender.com

  # -------------------------------------------------------------
  # 3. NEXT.JS ADMIN DASHBOARD APP
  # -------------------------------------------------------------
  - type: web
    name: iskconmargao-admin
    env: docker
    dockerfilePath: ./infra/docker/admin.Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://iskconmargao-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://iskconmargao-backend.onrender.com
      - key: API_INTERNAL_URL
        value: https://iskconmargao-backend.onrender.com

databases:
  # -------------------------------------------------------------
  # POSTGRES DATABASE
  # -------------------------------------------------------------
  - name: iskconmargao-db
    databaseName: iskconmargao
    user: iskcon
    plan: free
    region: singapore
